[project]
name = "onyx-personal-agent"
version = "0.2.0"
description = "Local modular Windows personal AI agent"
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.11.2",
  "scipy==1.18.1",
  "aec-audio-processing==1.0.1",
  "send2trash==2.1.0",
  "winrt-Windows.Media.Control==3.2.1",
  "winrt-Windows.Media==3.2.1",
  "winrt-Windows.Media.Ocr==3.2.1",
  "winrt-Windows.Globalization==3.2.1",
  "winrt-Windows.Graphics.Imaging==3.2.1",
  "winrt-Windows.Storage.Streams==3.2.1",
  "winrt-Windows.Foundation==3.2.1",
  "winrt-Windows.Foundation.Collections==3.2.1",
  "pycaw==20260921",
  "psutil==7.2.2",
  "Pillow==12.3.0",
  "faster-whisper>=1.2,<2",
  "keyboard>=0.13,<1",
  "numpy>=2.0,<3",
  "pyperclip>=1.9,<2",
  "pystray>=0.19,<1",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
  "uiautomation>=2.0,<3",
  "webrtcvad-wheels>=2.0,<3",
  "torch==2.14.0+cpu",
]

[project.scripts]
onyx = "app.main:main"
kk = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"kk.core" = ["*.json"]
"kk.ui" = ["*.qml", "*.frag", "*.qsb"]
"kk.tools.windows" = ["app_index.ps1", "shell_metadata.ps1"]
